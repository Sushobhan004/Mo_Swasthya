<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome Page</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1a1a2e;
            font-family: 'Poppins', sans-serif;
            color: #00d4ff;
            text-align: center;
        }

        h1 {
            font-size: 40px;
            animation: glow 1.5s infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #00d4ff;
            }
            to {
                text-shadow: 0 0 30px #00d4ff;
            }
        }
    </style>
</head>
<body>

    <h1>Welcome! 🎉 <br> You successfully entered to the web...</h1>

</body>
</html>
